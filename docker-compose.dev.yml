version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres-dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres123}
      POSTGRES_DB: ${DATABASE_NAME:-ecommerce_db}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - ecommerce-network-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5


  # NestJS Application (Development Mode)
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ecommerce-app-dev
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      DATABASE_ENGINE: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres123}
      DATABASE_NAME: ${DATABASE_NAME:-ecommerce_db}
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:-public}
      DATABASE_SYNCHRONIZE: ${DATABASE_SYNCHRONIZE:-false}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_TIME: ${JWT_EXPIRATION_TIME:-1800}
      JWT_REFRESH_TOKEN_SECRET: ${JWT_REFRESH_TOKEN_SECRET}
      JWT_REFRESH_TOKEN_EXPIRATION_TIME: ${JWT_REFRESH_TOKEN_EXPIRATION_TIME:-86400}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      DOMAIN: ${DOMAIN:-localhost}
      SERVER_PORT: 3000
      CAN_ACCESS_LOCAL: ${CAN_ACCESS_LOCAL:-true}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      OAUTH2_GOOGLE_CLIENT_ID: ${OAUTH2_GOOGLE_CLIENT_ID}
      OAUTH2_GOOGLE_CLIENT_SECRET: ${OAUTH2_GOOGLE_CLIENT_SECRET}
      VNPAY_HOST: ${VNPAY_HOST}
      VNP_TMNCODE: ${VNP_TMNCODE}
      VNP_HASHSECRET: ${VNP_HASHSECRET}
      VNP_IPADDR: ${VNP_IPADDR}
      VNP_RETURNURL: ${VNP_RETURNURL}
      AI_SERVICE_BASE_URL: ${AI_SERVICE_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network-dev
    volumes:
      - .:/app
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  postgres_data_dev:
    driver: local
  pgadmin_data_dev:
    driver: local

networks:
  ecommerce-network-dev:
    driver: bridge
